[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smj-eje"
version = "1.0.0"
description = "Private Smart-J reports with reliable scheduled synchronization"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "requests>=2.32.4,<3",
    "beautifulsoup4>=4.13,<5",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2",
    "XlsxWriter>=3.2.9,<4",
    "gunicorn>=23,<24; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
smj = "smj.cli:main"

[tool.setuptools.package-data]
smj = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.setuptools.packages.find]
include = ["smj*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
