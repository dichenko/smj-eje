{% extends 'base.html' %}
{% block content %}
<section class="login-card">
  <p class="eyebrow">SMART-J · ЛИЧНЫЙ ДОСТУП</p>
  <h1>Отчеты о занятиях</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login-fields">
      <label for="login">Логин<input id="login" name="login" value="{{ login_value | default('') }}" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label for="password">Пароль<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    </div>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit">Войти</button>
  </form>
</section>
{% endblock %}
