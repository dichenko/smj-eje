{% extends 'base.html' %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">НАБЛЮДЕНИЯ ЗАНЯТИЙ</p><h1>{{ title }}</h1></div></div>
<section class="card form-card">
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="form-grid">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Преподаватель<input name="teacher" value="{{ teacher_input }}" list="video-teachers" maxlength="403" required autocomplete="off"><datalist id="video-teachers">{% for option in teacher_options %}<option value="{{ option.value }}" data-teacher="{{ option.teacher }}" data-city="{{ option.city }}" data-modules="{{ option.modules | tojson | forceescape }}">{% endfor %}</datalist></label>
  <label>Город<input name="city" value="{{ video.city }}" maxlength="200" {% if automatic_city %}readonly{% endif %}><span class="field-hint" id="video-city-hint">Город подставляется при выборе преподавателя. Для нового преподавателя укажите город.</span></label>
  <label>Дата запроса<input type="date" name="request_date" value="{{ video.request_date }}" required></label>
  <label>Дата отправки<input type="date" name="sent_date" value="{{ video.sent_date or '' }}"></label>
  <label>Модуль<select name="module" required {% if not video_modules %}disabled{% endif %}>{% if not video_modules %}<option value="">Нет доступных модулей</option>{% elif video.module not in video_modules %}<option value="" selected>Выберите модуль</option>{% endif %}{% for module in video_modules %}<option value="{{ module }}" {% if video.module == module %}selected{% endif %}>{{ module }}</option>{% endfor %}</select><span class="field-hint" id="video-module-hint" aria-live="polite">{% if not video.teacher %}Выберите преподавателя, чтобы увидеть его модули.{% elif not video_modules %}Модули появятся после загрузки занятий этого преподавателя.{% else %}Только модули выбранного преподавателя.{% endif %}</span></label>
  <label>Координатор<select name="coordinator_id"><option value="">Автоматически по городу</option>{% for coordinator in coordinators %}<option value="{{ coordinator.id }}" data-city="{{ coordinator.city }}" {% if video.coordinator_id == coordinator.id %}selected{% endif %}>{{ coordinator.city }} — {{ coordinator.name }}</option>{% endfor %}</select></label>
  <label class="wide-field">Ссылка на видео<input type="url" name="video_url" value="{{ video.video_url }}" maxlength="2048" placeholder="https://…"><span class="field-hint">Если указана дата отправки, ссылка обязательна.</span></label>
  <label class="wide-field">Что хорошо<textarea name="positive_notes" rows="5" maxlength="16000">{{ video.positive_notes }}</textarea></label>
  <label class="wide-field">Зона роста<textarea name="growth_notes" rows="5" maxlength="16000">{{ video.growth_notes }}</textarea></label>
  <div class="form-actions"><button type="submit">Сохранить</button><a class="quiet" href="{{ url_for('videos') }}">Отмена</a>{% if video_id %}<a class="quiet" href="{{ url_for('video_excel_report', video_id=video_id) }}">Скачать Excel</a><a class="quiet danger" href="{{ url_for('video_delete', video_id=video_id, return_to='edit') }}">Удалить видео</a>{% endif %}</div>
</form>
</section>
<script src="{{ url_for('static', filename='video-form.js') }}" defer></script>
{% endblock %}
